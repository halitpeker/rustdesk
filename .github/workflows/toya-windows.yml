# Builds the Windows x64 RustDesk client with the Toya server built in,
# and publishes it as ToyaDestek.exe on the Releases page.
#
# Based on the official flutter-build.yml of RustDesk 1.5.3 (Windows x64 job only).
# Source changes are applied at build time by two steps:
#   "Set Toya server"   - default ID server and its public key (hbb_common config.rs)
#   "Set Toya branding" - app name, exe properties, hidden "set up your own server" tip
# The Toya icons are committed in place of the stock ones (res/, flutter/assets/icon.png,
# flutter/windows/runner/resources/app_icon.ico).
# The exe is NOT code signed.

name: Toya Windows build

on:
  workflow_dispatch:
  push:
    branches: [toya]
    paths:
      - ".github/workflows/toya-windows.yml"

permissions:
  contents: write

env:
  TOYA_SERVER: "rustdesk.toyayazilim.tr"
  TOYA_PUB_KEY: "V629TJnXXU5Wu0jtwJrrUzl70neU9iF6e0I3XLv8Uk8="
  TOYA_EXE_NAME: "ToyaDestek.exe"
  # App name: letters, digits, "-" and "_" only (the installer rejects anything else).
  TOYA_APP_NAME: "ToyaDestek"
  TOYA_PRODUCT_NAME: "Toya Destek"
  TOYA_COMPANY: "Toya Yazılım"
  RELEASE_TAG: "toya-1.5.3"

  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: ToyaDestek x86_64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set Toya server
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          echo "before:"
          grep -n -E '^pub const (RENDEZVOUS_SERVERS|RS_PUB_KEY):' "$f"
          sed -i -E 's|^pub const RENDEZVOUS_SERVERS: .*$|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&["'"$TOYA_SERVER"'"];|' "$f"
          sed -i -E 's|^pub const RS_PUB_KEY: .*$|pub const RS_PUB_KEY: \&str = "'"$TOYA_PUB_KEY"'";|' "$f"
          echo "after:"
          grep -n -E '^pub const (RENDEZVOUS_SERVERS|RS_PUB_KEY):' "$f"
          grep -q -F "pub const RENDEZVOUS_SERVERS: &[&str] = &[\"$TOYA_SERVER\"];" "$f"
          grep -q -F "pub const RS_PUB_KEY: &str = \"$TOYA_PUB_KEY\";" "$f"

      - name: Set Toya branding
        shell: bash
        run: |
          # App name: also gives the client its own config folder and, because the
          # name is no longer "RustDesk", turns off the stock update check.
          f=libs/hbb_common/src/config.rs
          sed -i -E 's|(pub static ref APP_NAME: RwLock<String> = RwLock::new\(")RustDesk("\.to_owned\(\)\);)|\1'"$TOYA_APP_NAME"'\2|' "$f"
          grep -n 'pub static ref APP_NAME' "$f"
          grep -q -F "pub static ref APP_NAME: RwLock<String> = RwLock::new(\"$TOYA_APP_NAME\".to_owned());" "$f"

          # Exe properties (copyright line is left as it is)
          rc=flutter/windows/runner/Runner.rc
          sed -i             -e 's|VALUE "ProductName", "RustDesk"|VALUE "ProductName", "'"$TOYA_PRODUCT_NAME"'"|'             -e 's|VALUE "FileDescription", "RustDesk Remote Desktop"|VALUE "FileDescription", "'"$TOYA_PRODUCT_NAME"'"|'             -e 's|VALUE "CompanyName", "Purslane Tech Pte. Ltd."|VALUE "CompanyName", "'"$TOYA_COMPANY"'"|' "$rc"
          grep -n -E 'VALUE "(ProductName|FileDescription|CompanyName)"' "$rc"
          grep -q -F "VALUE \"ProductName\", \"$TOYA_PRODUCT_NAME\"" "$rc"
          grep -q -F "VALUE \"FileDescription\", \"$TOYA_PRODUCT_NAME\"" "$rc"
          grep -q -F "VALUE \"CompanyName\", \"$TOYA_COMPANY\"" "$rc"

          # Same properties for the outer self-extracting exe (the file customers download)
          pc=libs/portable/Cargo.toml
          sed -i -e 's|^ProductName = "RustDesk"|ProductName = "'"$TOYA_PRODUCT_NAME"'"|' "$pc"
          sed -i -e 's|^FileDescription = "RustDesk Remote Desktop"|FileDescription = "'"$TOYA_PRODUCT_NAME"'"\nCompanyName = "'"$TOYA_COMPANY"'"|' "$pc"
          grep -n -A6 -F '[package.metadata.winres]' "$pc"
          grep -q -F "ProductName = \"$TOYA_PRODUCT_NAME\"" "$pc"
          grep -q -F "FileDescription = \"$TOYA_PRODUCT_NAME\"" "$pc"
          grep -q -F "CompanyName = \"$TOYA_COMPANY\"" "$pc"

          # Hide the "set up your own server" tip: the built-in server is already ours
          p=flutter/lib/desktop/pages/connection_page.dart
          sed -i 's|_svcIsUsingPublicServer.value),|false),|' "$p"
          if grep -q -F '_svcIsUsingPublicServer.value),' "$p"; then exit 1; fi
          grep -q -F "stateGlobal.svcStatus.value == SvcStatus.ready &&" "$p"

          # Toya icons must be present
          ls -l res/icon.ico res/tray-icon.ico flutter/assets/icon.png flutter/windows/runner/resources/app_icon.ico

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: find Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/$TOYA_EXE_NAME"
          ls -l ./SignOutput
          sha256sum "./SignOutput/$TOYA_EXE_NAME"

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ToyaDestek-windows-x86_64
          path: ./SignOutput/${{ env.TOYA_EXE_NAME }}
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Toya Destek (RustDesk ${{ env.VERSION }})"
          body: |
            RustDesk ${{ env.VERSION }} Windows x64, default server set to ${{ env.TOYA_SERVER }}.
            Built from this branch. Source changes: Toya icons, plus the "Set Toya server" and
            "Set Toya branding" steps of .github/workflows/toya-windows.yml.
            Based on RustDesk (https://github.com/rustdesk/rustdesk). Not code signed.
            License: AGPL-3.0 (see LICENCE).
          files: |
            ./SignOutput/${{ env.TOYA_EXE_NAME }}
